apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evidently
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DurojaiyeAbisoye/k8s_mlops_repo.git
    targetRevision: master
    path: applications/evidently
  destination:
    server: https://kubernetes.default.svc
    namespace: evidently
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
