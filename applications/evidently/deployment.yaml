apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: evidently-ui
  name: evidently-ui
  namespace: evidently
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidently-ui
  template:
    metadata:
      labels:
        app: evidently-ui
    spec:
      containers:
      - image: abisoye314/evidently-ui:latest
        imagePullPolicy: IfNotPresent
        name: evidently-ui
        resources:
          requests:
            cpu: "50m"
            memory: "150Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        command: ["evidently", "ui", "--host", "0.0.0.0", "--workspace", "/tmp/workspace", "--demo-projects", "none"]
        ports:
        - containerPort: 8000
