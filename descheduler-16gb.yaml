# =============================================================================
# Descheduler Configuration for Single-Node 16GB Kubeflow Cluster
# =============================================================================
# This evicts pods from overutilized nodes and removes crash-looping pods.
# On a single node, "overutilized" means the node is above target thresholds.
# The scheduler will then try to place them back more efficiently.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy
  namespace: kube-system
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    profiles:
      - name: "16gb-laptop"
        pluginConfig:
        - name: "DefaultEvictor"
          args:
            nodeFit: true
            evictFailedBarePods: true
            evictLocalStoragePods: true
        - name: "LowNodeUtilization"
          args:
            thresholds:
              cpu: 30
              memory: 30
              pods: 20
            targetThresholds:
              cpu: 70
              memory: 70
              pods: 60
            evictionLimits:
              node: 3
        - name: "RemovePodsHavingTooManyRestarts"
          args:
            podRestartThreshold: 5
            includingInitContainers: true
            states:
              - "CrashLoopBackOff"
        - name: "PodLifeTime"
          args:
            maxPodLifeTimeSeconds: 86400
            states:
              - "Pending"
              - "Running"
        plugins:
          balance:
            enabled:
              - "LowNodeUtilization"
          deschedule:
            enabled:
              - "RemovePodsHavingTooManyRestarts"
              - "PodLifeTime"

---
# Run descheduler as a CronJob every 10 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: descheduler
  namespace: kube-system
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: descheduler
        spec:
          priorityClassName: system-cluster-critical
          containers:
          - name: descheduler
            image: registry.k8s.io/descheduler/descheduler:v0.30.0
            imagePullPolicy: IfNotPresent
            command:
              - /bin/descheduler
            args:
              - --policy-config-file=/policy-dir/policy.yaml
              - --v=4
            volumeMounts:
            - mountPath: /policy-dir
              name: policy-volume
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
          restartPolicy: Never
          serviceAccountName: descheduler-sa
          volumes:
          - name: policy-volume
            configMap:
              name: descheduler-policy

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: descheduler-sa
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: descheduler-cluster-role
rules:
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list", "delete"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: descheduler-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: descheduler-cluster-role
subjects:
- name: descheduler-sa
  namespace: kube-system
  kind: ServiceAccount
